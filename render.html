<!doctype html><html><head><meta charset="utf-8"><title>Placement Lesson 06 · deterministic scene renderer</title><style>html,body{margin:0;background:#fff9ec;width:100%;height:100%;overflow:hidden}#frame{width:100vw;height:100vh}.teaching-scene{width:100%;height:100%;display:block}</style></head><body><div id="frame"></div><script type="module">
import{Scene}from'./scene.js';import{stateAt}from'./timeline.js';
const params=new URLSearchParams(location.search),voice=params.get('voice')||'en_gb';
const script=await fetch('content/script.json').then(r=>r.json());
const response=await fetch(`media/timings/${voice}.json`);if(!response.ok)throw new Error('Measured voice timeline not available.');
const clock=await response.json();window.clock=clock;window.script=script;
window.renderAt=t=>{const state=stateAt(t,clock,script);document.querySelector('#frame').innerHTML=Scene(state);return state};
window.renderCue=(id,progress=0)=>{const cue=clock.segments.find(s=>s.id===id);if(!cue)throw new Error('Unknown cue '+id);return window.renderAt(cue.start+(cue.sceneEnd-cue.start)*progress)};
await document.fonts.ready;window.renderAt(Number(params.get('t')||0));window.ready=true;
if(params.has('preview')){const bar=document.createElement('div');bar.style='position:fixed;bottom:12px;left:4%;width:92%;box-sizing:border-box;background:#fffdf5ee;border:1px solid #9aaf9d;padding:10px;display:flex;gap:12px;align-items:center;color:#355f55;font:14px Segoe UI;border-radius:12px';bar.innerHTML='<button>Play / pause</button><input type="range" min="0" max="'+clock.duration+'" step="0.01" value="0" style="flex:1"><span>0.00 s</span><a href="index.html">Back to lesson</a>';document.body.append(bar);let playing=false,last=0,t=0;const slider=bar.querySelector('input');function set(v){t=Number(v);window.renderAt(t);slider.value=t;bar.querySelector('span').textContent=t.toFixed(2)+' s'}slider.oninput=()=>{playing=false;set(slider.value)};bar.querySelector('button').onclick=()=>playing=!playing;function tick(now){if(playing)set((t+(now-last)/1000)%clock.duration);last=now;requestAnimationFrame(tick)}requestAnimationFrame(tick)}
</script></body></html>
